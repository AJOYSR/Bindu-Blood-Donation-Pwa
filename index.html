<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7fa" />
    <meta name="description" content="Bindu privately connects blood donors with urgent requests in Bangladesh — fast, safe and consent-first." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Bindu — The right donor, right when it matters</title>
    <style>
      /* Boot splash: painted before JS loads, faded out by main.tsx */
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #f7f7fa; transition: opacity .4s ease, visibility .4s; }
      #boot.is-hidden { opacity: 0; visibility: hidden; }
      #boot .mark { width: 56px; height: 56px; animation: bootbeat 1.3s cubic-bezier(.22,1,.36,1) infinite; filter: drop-shadow(0 8px 18px rgba(224,36,60,.35)); }
      #boot .bar { width: 120px; height: 3px; margin-top: 22px; border-radius: 3px; background: #ebebf1; overflow: hidden; }
      #boot .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #e0243c; animation: bootbar 1s ease-in-out infinite; }
      #boot > div { display: grid; justify-items: center; }
      @keyframes bootbeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(.98); } 45% { transform: scale(1.06); } }
      @keyframes bootbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .mark, #boot .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div>
        <svg class="mark" viewBox="0 0 40 40"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d63"/><stop offset="1" stop-color="#c01431"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#bg)"/><path d="M20 7.5c-4.6 6.2-8.5 10.6-8.5 15.4a8.5 8.5 0 0 0 17 0c0-4.8-3.9-9.2-8.5-15.4Z" fill="#fff"/><path d="M14.2 23.4h3l1.6-3.4 2.4 6 1.7-2.6h3" fill="none" stroke="#e0243c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
